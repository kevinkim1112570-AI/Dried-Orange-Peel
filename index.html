<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>橙皮 Stock List</title>
<style>
  :root{
    --bg:#f4f2ee; --card:#ffffff; --ink:#2b2a28; --muted:#8a867e; --line:#e6e2da;
    --accent:#e8772e; --accent-dark:#c9621f; --accent-soft:#fcefe4;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
  h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:16px;margin-top:2px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .who{color:var(--muted);font-size:15px}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;margin-left:6px}
  button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent-dark)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
  button.small{padding:6px 14px;font-size:15px}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:disabled:hover{border-color:var(--line);color:var(--ink)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:24px}
  .panel h2{margin:0 0 16px;font-size:20px}
  form.stock{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--muted)}
  input,textarea{font:inherit;color:var(--ink);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fbfaf8;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  input[readonly]{color:var(--accent-dark);font-weight:700;background:var(--accent-soft);border-color:var(--accent-soft)}
  .f-code{grid-column:span 2}.f-name{grid-column:span 4}.f-weight,.f-year,.f-place{grid-column:span 2}
  .f-detail{grid-column:span 6}.f-pic{grid-column:span 6}
  .modal-box{background:#fff;border-radius:18px;padding:24px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
  .modal-box h2{margin:0 0 16px;font-size:22px}
  textarea{min-height:76px;resize:vertical}
  .actions{grid-column:span 6;display:flex;gap:10px;justify-content:flex-end}

  .login{max-width:420px;margin:60px auto}
  .login form{display:flex;flex-direction:column;gap:14px}
  .msg{font-size:15px;color:#b3412a;min-height:22px}
  .notice{background:var(--accent-soft);border:1px solid #f4d9c3;border-radius:14px;padding:14px 18px;margin-bottom:20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:16px}

  .bar{display:flex;gap:14px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .bar input{max-width:360px}
  .count{color:var(--muted);font-size:16px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px}
  .card:hover{box-shadow:0 6px 22px rgba(60,40,10,.07)}
  .code{align-self:flex-start;background:var(--accent-soft);color:var(--accent-dark);font-weight:700;font-size:15px;padding:3px 12px;border-radius:999px;letter-spacing:.5px}
  .name{font-size:24px;font-weight:700;line-height:1.25;margin:2px 0}
  .meta{display:flex;gap:22px}
  .meta div{display:flex;flex-direction:column}
  .meta small{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.8px}
  .meta b{font-size:20px;font-weight:600}
  .detail{color:#55524c;font-size:16px;white-space:pre-wrap;flex:1}
  .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .row .spacer{flex:1}
  .empty{text-align:center;color:var(--muted);padding:60px 0;border:1px dashed var(--line);border-radius:18px}

  .lightbox{position:fixed;inset:0;background:rgba(30,28,25,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .lightbox.open{display:flex}
  .lb-box{background:#fff;border-radius:18px;padding:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
  .lb-box img{width:100%;border-radius:12px;display:block}
  .lb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  .lb-head b{font-size:20px}
  .lb-fail{color:var(--muted);padding:20px 0}
  .lb-fail a{color:var(--accent-dark)}

  @media(max-width:720px){
    form.stock{grid-template-columns:repeat(2,1fr)}
    .f-code,.f-weight,.f-year,.f-place{grid-column:span 1}.f-name,.f-detail,.f-pic,.actions{grid-column:span 2}
    h1{font-size:28px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>橙皮</span> Stock List</h1>
      <div class="sub">Liquid stock register · live team data</div>
    </div>
    <div class="tools" id="tools" hidden>
      <span class="who" id="who"></span>
      <button id="addNewBtn" class="primary" hidden>Add New</button>
      <button id="exportBtn" class="small">Export</button>
      <button id="signOutBtn" class="small">Sign out</button>
    </div>
  </header>

  <!-- Login -->
  <section class="panel login" id="loginView">
    <h2>Team sign in</h2>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required autocomplete="username"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <div class="msg" id="loginMsg"></div>
      <button class="primary" type="submit" id="loginBtn">Sign in</button>
    </form>
  </section>

  <!-- App -->
  <div id="appView" hidden>
    <div class="notice" id="localNotice" hidden>
      <span id="localNoticeText"></span>
      <button class="small primary" id="migrateBtn">Upload to team list</button>
    </div>

    <div class="lightbox" id="formModal">
     <div class="modal-box">
      <h2 id="formTitle">Add new item</h2>
      <form class="stock" id="form" autocomplete="off">
        <label class="f-code">Code<input id="code" readonly placeholder="Auto"></label>
        <label class="f-name">Name<input id="name" required placeholder="e.g. 橙皮糖浆 Orange Peel Syrup"></label>
        <label class="f-weight">Weight<input id="weight" placeholder="e.g. 700 ml"></label>
        <label class="f-year">Particular Year<input id="year" placeholder="e.g. 2021"></label>
        <label class="f-place">Place of Stock<input id="place" placeholder="e.g. Shelf A2"></label>
        <label class="f-detail">Detail<textarea id="detail" placeholder="Notes, origin, batch, condition…"></textarea></label>
        <label class="f-pic">Picture Link<input id="pic" type="url" placeholder="https://…"></label>
        <div class="actions">
          <div class="msg" id="formMsg" style="margin-right:auto"></div>
          <button type="button" id="cancelBtn" hidden>Cancel</button>
          <button type="submit" class="primary" id="saveBtn">Add item</button>
        </div>
      </form>
     </div>
    </div>

    <div class="bar">
      <input id="search" type="search" placeholder="Search code, name, year, detail…">
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mhdxkwmjrquvvzpwolxx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7LJzFZ-twiuUF6olOZj0dQ_ygO5jcQm';
const TABLE = 'orange_peel_stock';
const LEGACY_KEY = 'orange_peel_stock_v1';   // old local-storage data

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let items = [];
let editingId = null;
let canEdit = false;
let channel = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch(e){ return ''; } }
function legacyItems(){
  try { const a = JSON.parse(localStorage.getItem(LEGACY_KEY)); return Array.isArray(a) ? a : []; } catch(e){ return []; }
}

/* ---------- auth ---------- */
async function showForSession(session){
  if(!session){
    $('loginView').hidden = false; $('appView').hidden = true; $('tools').hidden = true;
    if(channel){ sb.removeChannel(channel); channel = null; }
    return;
  }
  $('loginView').hidden = true; $('appView').hidden = false; $('tools').hidden = false;
  const { data: ce } = await sb.rpc('can_edit');
  canEdit = ce === true;
  $('who').innerHTML = esc(session.user.email) + `<span class="badge">${canEdit ? 'Can edit' : 'View only'}</span>`;
  $('addNewBtn').hidden = !canEdit;
  resetForm();
  await load();
  checkLegacy();
  if(!channel){
    channel = sb.channel('orange-peel').on('postgres_changes',{event:'*',schema:'public',table:TABLE},()=>load()).subscribe();
  }
}
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  $('loginMsg').textContent = ''; $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  $('loginBtn').disabled = false;
  if(error) $('loginMsg').textContent = error.message;
});
$('signOutBtn').addEventListener('click', ()=> sb.auth.signOut());
sb.auth.onAuthStateChange((evt, session)=>{
  if(evt === 'INITIAL_SESSION' || evt === 'SIGNED_IN' || evt === 'SIGNED_OUT') setTimeout(()=>showForSession(session),0);
});

/* ---------- data ---------- */
async function load(){
  const { data, error } = await sb.from(TABLE).select('*').order('code',{ascending:true});
  if(error){ $('list').innerHTML = `<div class="empty" style="grid-column:1/-1">Could not load data: ${esc(error.message)}</div>`; return; }
  items = data.sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));
  render();
}
function render(){
  const q = $('search').value.trim().toLowerCase();
  const shown = items.filter(i => !q || [i.code,i.name,i.weight,i.year,i.place_of_stock,i.detail].join(' ').toLowerCase().includes(q));
  $('count').textContent = `${shown.length} of ${items.length} items`;
  if(!shown.length){
    $('list').innerHTML = `<div class="empty" style="grid-column:1/-1">${items.length ? 'No matching items.' : 'No stock yet.' + (canEdit ? ' Click Add New to add your first item.' : '')}</div>`;
    return;
  }
  $('list').innerHTML = shown.map(i => `
    <article class="card">
      <span class="code">${esc(i.code)}</span>
      <div class="name">${esc(i.name)}</div>
      <div class="meta">
        <div><small>Weight</small><b>${esc(i.weight) || '—'}</b></div>
        <div><small>Year</small><b>${esc(i.year) || '—'}</b></div>
        <div><small>Place of Stock</small><b>${esc(i.place_of_stock) || '—'}</b></div>
      </div>
      <div class="detail">${esc(i.detail)}</div>
      <div class="row">
        <button class="small primary" data-act="pic" data-id="${i.id}" ${safeUrl(i.pic_url)?'':'disabled'}>Pic</button>
        <span class="spacer"></span>
        ${canEdit ? `<button class="small" data-act="edit" data-id="${i.id}">Edit</button>
        <button class="small" data-act="del" data-id="${i.id}">Delete</button>` : ''}
      </div>
    </article>`).join('');
}

function resetForm(){
  editingId = null;
  $('form').reset();
  $('code').value = '';
  $('formMsg').textContent = '';
  $('formTitle').textContent = 'Add new item';
  $('saveBtn').textContent = 'Add item';
  $('cancelBtn').hidden = true;
}

$('form').addEventListener('submit', async e=>{
  e.preventDefault();
  const rec = {
    name: $('name').value.trim(),
    weight: $('weight').value.trim(),
    year: $('year').value.trim(),
    place_of_stock: $('place').value.trim(),
    detail: $('detail').value.trim(),
    pic_url: $('pic').value.trim()
  };
  if(!rec.name) return;
  $('saveBtn').disabled = true; $('formMsg').textContent = '';
  const { error } = editingId
    ? await sb.from(TABLE).update(rec).eq('id', editingId)
    : await sb.from(TABLE).insert(rec);
  $('saveBtn').disabled = false;
  if(error){ $('formMsg').textContent = error.message; return; }
  resetForm(); closeForm(); load();
});
$('cancelBtn').addEventListener('click', ()=>{ resetForm(); closeForm(); });
$('addNewBtn').addEventListener('click', ()=>{ resetForm(); openForm(); });
function openForm(){ $('formModal').classList.add('open'); setTimeout(()=>$('name').focus(),50); }
function closeForm(){ $('formModal').classList.remove('open'); }
$('formModal').addEventListener('mousedown', e=>{ if(e.target === $('formModal')){ resetForm(); closeForm(); } });
$('search').addEventListener('input', render);

$('list').addEventListener('click', async e=>{
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const it = items.find(i => i.id === b.dataset.id); if(!it) return;
  if(b.dataset.act === 'pic') openPic(it);
  if(b.dataset.act === 'edit'){
    editingId = it.id;
    $('code').value = it.code; $('name').value = it.name; $('weight').value = it.weight;
    $('year').value = it.year; $('place').value = it.place_of_stock || ''; $('detail').value = it.detail; $('pic').value = it.pic_url;
    $('formTitle').textContent = 'Edit ' + it.code;
    $('saveBtn').textContent = 'Save changes';
    $('cancelBtn').hidden = false;
    openForm();
  }
  if(b.dataset.act === 'del' && confirm(`Delete ${it.code} · ${it.name}?`)){
    const { error } = await sb.from(TABLE).delete().eq('id', it.id);
    if(error){ alert(error.message); return; }
    if(editingId === it.id) resetForm();
    load();
  }
});

/* ---------- picture link ---------- */
function openPic(it){
  const url = safeUrl(it.pic_url);
  if(url) window.open(url, '_blank', 'noopener');
}

/* ---------- export ---------- */
$('exportBtn').addEventListener('click', ()=>{
  const out = items.map(({code,name,weight,year,place_of_stock,detail,pic_url})=>({code,name,weight,year,place_of_stock,detail,pic:pic_url}));
  const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'orange-peel-stock-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
});

/* ---------- one-time migration of old local-storage data ---------- */
function checkLegacy(){
  const old = legacyItems();
  const show = canEdit && old.length > 0;
  $('localNotice').hidden = !show;
  if(show) $('localNoticeText').textContent = `Found ${old.length} item(s) saved in this browser from the old version. Upload them to the shared team list?`;
}
$('migrateBtn').addEventListener('click', async ()=>{
  const old = legacyItems();
  if(!old.length) return;
  $('migrateBtn').disabled = true;
  for(const d of old){      // one by one so codes are numbered in order
    const { error } = await sb.from(TABLE).insert({
      name: String(d.name||'').trim() || '(no name)',
      weight: String(d.weight||''), year: String(d.year||''),
      detail: String(d.detail||''), pic_url: safeUrl(d.pic||'')
    });
    if(error){ alert('Upload stopped: ' + error.message); $('migrateBtn').disabled = false; await load(); return; }
  }
  localStorage.removeItem(LEGACY_KEY);
  $('migrateBtn').disabled = false;
  checkLegacy(); load();
});
</script>
</body>
</html>
